name: Daily Tweet Digest

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install twitter-cli
      - name: Collect tweets
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
        run: python daily_collect.py
      - name: Commit data
        run: |
          git config user.name "tweet-digest-bot"
          git config user.email "bot@tweet-digest.local"
          git add data/ static/data/
          git diff --staged --quiet || git commit -m "Daily digest: $(date +%Y-%m-%d)"
          git push

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./static"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
