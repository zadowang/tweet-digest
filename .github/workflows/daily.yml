name: Daily Tweet Digest

on:
  schedule:
    - cron: "0 10 * * *"  # 18:00 CST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install twitter-cli
      - name: Collect tweets
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
        run: python daily_collect.py
      - name: Commit data
        run: |
          git config user.name "tweet-digest-bot"
          git config user.email "bot@tweet-digest.local"
          git add data/ static/data/
          if ! git diff --staged --quiet; then
            git commit -m "Daily digest: $(TZ='Asia/Shanghai' date +%Y-%m-%d)"
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./static"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
