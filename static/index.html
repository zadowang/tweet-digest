<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>推文日报 — @whyyoutouzhele</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="header-inner">
    <h1>推文日报</h1>
    <div class="header-meta">
      <span class="user-tag">@whyyoutouzhele</span>
      <span class="date-range" id="dateRange">加载中...</span>
      <span class="tweet-count" id="tweetCount"></span>
    </div>
  </div>
</header>
<main id="app">
  <div class="filter-bar">
    <div class="filters" id="filters"></div>
  </div>
  <div class="tweets-grid" id="tweetsGrid">
    <div class="loading">加载中...</div>
  </div>
</main>
<footer>
  <p>每日 18:00 自动更新 &middot; <span id="updateTime">—</span></p>
</footer>
<script src="app.js"></script>
</body>
</html>
