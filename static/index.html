<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>推文日报 — @whyyoutouzhele</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="header-inner">
    <h1>推文日报</h1>
    <div class="header-meta">
      <span class="user-tag">@whyyoutouzhele</span>
      <span class="date-range" id="dateRange">加载中...</span>
    </div>
  </div>
</header>
<main id="app">
  <section class="daily-summary" id="dailySummary">
    <div class="summary-header">
      <h2>今日摘要</h2>
      <span class="summary-badge" id="tweetCount"></span>
    </div>
    <div class="summary-body" id="summaryBody">
      <div class="loading">正在加载...</div>
    </div>
  </section>
  <section class="tweets-section">
    <div class="tweets-header">
      <h2>全部推文</h2>
      <div class="filters" id="filters"></div>
    </div>
    <div class="tweets-grid" id="tweetsGrid">
      <div class="loading">加载中...</div>
    </div>
  </section>
</main>
<footer>
  <div class="qr-section">
    <div class="qr-code" id="qrBox"></div>
    <p class="qr-label">手机扫码访问</p>
    <p class="qr-url" id="qrUrl"></p>
  </div>
  <p>自动更新于 <span id="updateTime">—</span> &middot; 每日 18:00 刷新</p>
</footer>
<script src="app.js"></script>
</body>
</html>
